<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@600&family=Golos+Text:wght@400;500&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:640px;height:360px;overflow:hidden;font-family:'Golos Text',sans-serif;background:radial-gradient(ellipse 90% 120% at 20% 0%,#3f786e,#215149 50%,#132623);color:#fff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px}
.wrap{position:relative;display:flex;align-items:center;gap:36px;height:100%;padding:0 48px}
img{width:176px;height:176px;border-radius:50%;box-shadow:0 20px 40px -10px rgba(0,0,0,.5),0 0 0 4px rgba(255,255,255,.14);flex-shrink:0}
h1{font-family:Geologica;font-weight:600;font-size:34px;line-height:1.08;letter-spacing:-.03em}
p{margin-top:14px;font-size:18px;line-height:1.45;color:#c1d6d1}
.chips{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
.chips b{font-weight:500;font-size:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
</style></head><body><div class="grid"></div>
<div class="wrap"><img src="avatar.png" alt="">
<div><h1>Ответы на&nbsp;отзывы<br>за&nbsp;минуты</h1>
<p>Три варианта ответа от ИИ для Wildberries и Ozon — решение за&nbsp;вами.</p>
<div class="chips"><b>WB</b><b>Ozon</b><b>Free без карты</b></div></div></div>
</body></html>
