<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@600&family=Golos+Text:wght@400;500&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:'Golos Text',sans-serif;background:#fafaf8;color:#15181c;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(20,24,22,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(20,24,22,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent)}
.glow{position:absolute;right:-120px;top:-160px;width:700px;height:600px;background:radial-gradient(closest-side,rgba(63,120,110,.22),transparent)}
.wrap{position:relative;padding:72px 80px;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;font-family:Geologica;font-weight:600;font-size:28px;letter-spacing:-.02em}
.logo i{width:52px;height:52px;border-radius:14px;background:#215149;display:flex;align-items:center;justify-content:center}
h1{font-family:Geologica;font-weight:600;font-size:68px;line-height:1.04;letter-spacing:-.035em;margin-top:52px;max-width:900px}
h1 span{color:#215149}
p{margin-top:24px;font-size:26px;color:#565c63;max-width:820px;line-height:1.45}
.chips{margin-top:auto;display:flex;gap:14px}
.chips b{font-weight:500;font-size:22px;padding:12px 22px;border-radius:999px;background:#fff;border:1px solid rgba(21,24,28,.1);color:#15181c}
.chips b.on{background:#215149;color:#fff;border-color:#215149}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="logo"><i><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 13v-2M8 16V8M12 18V6M16 15V9M20 13v-2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></i>Голос бренда</div>
  <h1>Ответы на&nbsp;отзывы за&nbsp;минуты.<br><span>Прямо в&nbsp;Telegram.</span></h1>
  <p>Три варианта ответа от ИИ для Wildberries и Ozon — а решение за вами.</p>
  <div class="chips"><b class="on">Бесплатно без карты</b><b>Wildberries</b><b>Ozon</b><b>Telegram</b></div>
</div>
</body></html>
