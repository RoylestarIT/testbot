name: Deploy website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build static site (GitHub Pages basePath)
        working-directory: website
        run: npm ci && npm run build:gh-pages
      - name: Push to gh-pages branch
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch out/.nojekyll
          npx gh-pages -d out --nojekyll -m "Deploy landing [skip ci]" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
