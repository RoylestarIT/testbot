name: Sync public metrics for landing

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch metrics from bot
        env:
          METRICS_URL: ${{ secrets.BOT_PUBLIC_METRICS_URL }}
        run: |
          if [ -z "$METRICS_URL" ]; then
            echo "BOT_PUBLIC_METRICS_URL not set — skip (add repo secret to enable auto counter)."
            exit 0
          fi
          curl -sfS --max-time 30 "$METRICS_URL" -o /tmp/metrics.json
          python3 - <<'PY'
          import json, sys
          with open("/tmp/metrics.json") as f:
              data = json.load(f)
          if "sellersWithCabinet" not in data:
              sys.exit("missing sellersWithCabinet")
          n = data["sellersWithCabinet"]
          if not isinstance(n, int) or n < 0:
              sys.exit("invalid sellersWithCabinet")
          out = {
              "sellersWithCabinet": n,
              "telegramAccounts": data.get("telegramAccounts"),
              "updatedAt": data.get("updatedAt"),
          }
          with open("website/public/metrics.json", "w") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit metrics if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/metrics.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: sync seller count for landing"
          git push
